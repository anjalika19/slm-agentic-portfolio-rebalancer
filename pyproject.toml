[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bl"
version = "0.1.0"
description = "Multi-agent LLM debate feeding a Black-Litterman monthly portfolio rebalancer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "scipy>=1.14",
    "cvxpy>=1.5",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4"]
gemini = ["google-genai>=1.0"]
live = ["fredapi>=0.5", "yfinance>=0.2", "openpyxl>=3.1", "requests>=2.31", "certifi"]
tracing = ["arize-phoenix", "arize-phoenix-otel>=0.16", "opentelemetry-sdk"]
all = ["agentic-bl[ollama,gemini,live,tracing]"]

[project.scripts]
agentic-bl-run = "agentic_bl.run_single:main"
agentic-bl-backtest = "agentic_bl.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]
